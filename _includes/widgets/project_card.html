{% assign projects = include.projects %}
<div class="my-3 p-0 bg-white shadow-sm rounded-xl">
    <h6 class="border-bottom border-gray p-3 mb-0">
        {% if include.title %}{{ include.title }}{% else %}<i class="fas fa-code"></i> Selected Projects{% endif %}
        <a href="{{ 'projects' | relative_url }}">(view all <i class="fas fa-angle-double-right"></i>)</a>
    </h6>
    {% for item in projects limit:include.limit %}
        {% include widgets/project_item.html item=item first=false last=false hide_bottom_border=forloop.last %}
    {% endfor %}
</div>
