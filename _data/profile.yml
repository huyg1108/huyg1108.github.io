short_bio: >-
  <p>
  I'm currently pursuing a B.S. in Information Technology, majoring in Knowledge Engineering at the University of Science (VNU-HCM), with a strong focus on building intelligent systems. Since joining AI-Thena group at FIT-HCMUS in 2024 under the supervision of <a href="https://scholar.google.com/citations?user=MGeNXaMAAAAJ&hl=vi&oi=ao" target="_blank">Dr. Tung Le</a> and <a href="https://scholar.google.com/citations?user=WBCZ2DcAAAAJ&hl=vi&oi=ao" target="_blank">Dr. Huy Tien Nguyen</a>, I have explored problems chiefly in multimodal fact verification, alongside cross-lingual transfer and legal information retrieval, often leveraging large and small language models and retrieval-based reasoning techniques.
  </p>
# Looking ahead, I aim to channel these AI capabilities into a new frontier: automated fuzzing for Web API security, with an emphasis on oracle inference and uncovering subtle response-level authorization vulnerabilities.

